name: CI

# Builds every PR in a clean Linux checkout, as Cloudflare does. No secrets
# and a read-only token, so a malicious dependency in a PR has nothing to
# steal and nothing it can push. Dependabot auto-merge waits on this check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from packageManager in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Catches a broken wrangler.toml or Worker before Cloudflare does
      - run: pnpm exec wrangler deploy --dry-run
