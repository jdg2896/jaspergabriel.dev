name = "jaspergabriel-dev"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
# Served only at jaspergabriel.dev; a workers.dev copy would be a duplicate
# site for search engines, and deploys re-enable it unless it's off here
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "toasts"
database_id = "711c7434-7309-49c4-ab48-5e3b1e08d954"

# Caps toast writes per IP; a reader toggles a few times, a script thousands
[[ratelimits]]
name = "TOAST_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Workers Logs, to spot abuse of the toast API (403s and 429s); set here
# because a deploy resets dashboard settings to this file
[observability.logs]
enabled = true
